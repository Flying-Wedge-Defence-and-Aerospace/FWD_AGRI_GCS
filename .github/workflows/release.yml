name: Release

on:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '5.15.2'
  QT_ARCH: 'gcc_64'
  ANDROID_NDK_VERSION: '21.3.6528147'
  ANDROID_BUILD_TOOLS: '29.0.3'
  ANDROID_PLATFORM: 'android-29'
  APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: UTC
    steps:
      - name: Install git and sudo
        run: |
          ln -fs /usr/share/zoneinfo/$TZ /etc/localtime
          apt-get update
          apt-get install -y --fix-missing git sudo software-properties-common

      - name: Enable universe repository
        run: |
          add-apt-repository -y universe

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject PAT token
        run: |
          echo '#pragma once' > src/FWDUpdateManager/FWDUpdateConfig_local.h
          echo '#define FWD_UPDATE_GITHUB_TOKEN  "${{ env.PAT_TOKEN }}"' >> src/FWDUpdateManager/FWDUpdateConfig_local.h

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --fix-missing \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-gl1.0-0 \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-gl \
            gstreamer1.0-plugins-rtp \
            gstreamer1.0-rtsp \
            gstreamer1.0-x \
            libgstreamer-plugins-good1.0-dev \
            gstreamer1.0-qt5 \
            libssl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-glx0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-xinerama0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdrm-dev \
            libgbm-dev \
            libsdl2-dev \
            patchelf \
            wget \
            file \
            python3 \
            python3-pip

      - name: Install Qt 5.15.2 via aqtinstall
        run: |
          pip3 install aqtinstall
          mkdir -p /opt/Qt
          aqt install-qt linux desktop 5.15.2 gcc_64 -m qtcharts -O /opt/Qt
          echo "Qt5_DIR=/opt/Qt/5.15.2/gcc_64/lib/cmake/Qt5" >> $GITHUB_ENV
          echo "/opt/Qt/5.15.2/gcc_64/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=/opt/Qt/5.15.2/gcc_64/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Create build directory
        run: |
          mkdir -p build/Desktop_Qt_5_15_2_GCC_64bit-Release
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release
          qmake ../../qgroundcontrol.pro -r CONFIG+=release

      - name: Build
        run: |
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release
          make -j$(nproc)

      - name: Create AppDir
        run: |
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release/staging
          mkdir -p AppDir
          cp -rL Qt AppDir/
          cp -L /lib/x86_64-linux-gnu/libcrypto.so.1.1 AppDir/Qt/libs/ 2>/dev/null || true
          cp -L /lib/x86_64-linux-gnu/libssl.so.1.1 AppDir/Qt/libs/ 2>/dev/null || true
          cp -L /lib/x86_64-linux-gnu/libcrypto.so.3 AppDir/Qt/libs/ 2>/dev/null || true
          cp -L /lib/x86_64-linux-gnu/libssl.so.3 AppDir/Qt/libs/ 2>/dev/null || true
          cp -L FWD_AGRI_GCS AppDir/
          cp -L qgroundcontrol.desktop AppDir/
          cp -L qgroundcontrol.png AppDir/
          cp -L qgroundcontrol-start.sh AppDir/
          cp -L qt.conf AppDir/
          mkdir -p AppDir/gstreamer-1.0
          GST_DIR=""
          for DIR in /usr/lib/x86_64-linux-gnu/gstreamer-1.0 /usr/lib/gstreamer-1.0 /usr/lib/gstreamer-1.0; do
            if [ -d "$DIR" ] && [ "$(ls -A $DIR 2>/dev/null)" ]; then
              GST_DIR="$DIR"
              break
            fi
          done
          if [ -n "$GST_DIR" ]; then
            cp -L "$GST_DIR"/*.so AppDir/gstreamer-1.0/ 2>/dev/null || true
            echo "Bundled all GStreamer plugins from $GST_DIR"
            echo "Bundled $(ls AppDir/gstreamer-1.0/*.so 2>/dev/null | wc -l) plugins"
            ls AppDir/gstreamer-1.0/libgstlibav.so 2>/dev/null && echo "libav (H264 decoder) bundled OK" || echo "WARNING: libgstlibav.so NOT bundled"
            for PLUGIN in AppDir/gstreamer-1.0/*.so; do
              ldd "$PLUGIN" 2>/dev/null | while read -r line; do
                case "$line" in
                  *"=>"*"/"*) lib="${line#*=> }"; lib="${lib%% *}" ;;
                  *) continue ;;
                esac
                if [ -f "$lib" ]; then
                  cp -L -n "$lib" AppDir/Qt/libs/ 2>/dev/null || true
                fi
              done
            done
            ldd AppDir/FWD_AGRI_GCS 2>/dev/null | while read -r line; do
              case "$line" in
                *"libgstreamer"*|*"libgst"*)
                  lib="${line#*=> }"; lib="${lib%% *}"
                  [ -f "$lib" ] && cp -L -n "$lib" AppDir/Qt/libs/ 2>/dev/null || true ;;
              esac
            done
            echo "Bundled GStreamer runtime libs: $(ls AppDir/Qt/libs/*.so* 2>/dev/null | wc -l)"
          else
            echo "ERROR: No GStreamer plugin directory found"
            find /usr -name "*.so" -path "*gstreamer*" 2>/dev/null | head -10
          fi
          echo '#!/bin/bash' > AppDir/AppRun
          echo 'HERE="$(dirname "$(readlink -f "$0")")"' >> AppDir/AppRun
          echo 'export LD_LIBRARY_PATH="$HERE/Qt/libs:$LD_LIBRARY_PATH"' >> AppDir/AppRun
          echo 'export QT_PLUGIN_PATH="$HERE/Qt/plugins"' >> AppDir/AppRun
          echo 'export QML2_IMPORT_PATH="$HERE/Qt/qml"' >> AppDir/AppRun
          echo 'export GST_PLUGIN_PATH="$HERE/gstreamer-1.0"' >> AppDir/AppRun
          echo 'export GST_PLUGIN_SYSTEM_PATH_1_0="$HERE/gstreamer-1.0"' >> AppDir/AppRun
          echo 'exec "$HERE/FWD_AGRI_GCS" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          chmod +x AppDir/qgroundcontrol-start.sh

      - name: Download appimagetool
        run: |
          apt-get install -y libfuse2
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Create AppImage
        run: |
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release/staging
          VERSION=${GITHUB_REF#refs/tags/}
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 /tmp/appimagetool AppDir "FWDAgriGCS-${VERSION}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/Desktop_Qt_5_15_2_GCC_64bit-Release/staging/*.AppImage

  android-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject PAT token
        run: |
          echo '#pragma once' > src/FWDUpdateManager/FWDUpdateConfig_local.h
          echo '#define FWD_UPDATE_GITHUB_TOKEN  "${{ env.PAT_TOKEN }}"' >> src/FWDUpdateManager/FWDUpdateConfig_local.h

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: 'android'
          modules: 'qtcharts'

      - name: Setup Java 17 (for SDK tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Setup Java 11 (for Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Create build directory
        run: |
          mkdir -p build/Android_Qt_5_15_2_Clang_Multi_Abi-Release

      - name: Run qmake
        working-directory: build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
        run: |
          qmake ../../qgroundcontrol.pro -r CONFIG+=release ANDROID_ABIS=arm64-v8a

      - name: Build
        working-directory: build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
        run: |
          make -j$(nproc)

      - name: Install to staging
        working-directory: build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
        run: |
          make INSTALL_ROOT=$(pwd)/android-build install

      - name: Pre-create android-build with AndroidX
        run: |
          mkdir -p build/Android_Qt_5_15_2_Clang_Multi_Abi-Release/android-build
          echo "android.useAndroidX=true" > build/Android_Qt_5_15_2_Clang_Multi_Abi-Release/android-build/gradle.properties
          echo "android.enableJetifier=false" >> build/Android_Qt_5_15_2_Clang_Multi_Abi-Release/android-build/gradle.properties

      - name: Run androiddeployqt
        continue-on-error: true
        run: |
          cd build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
          find . -name "*.json" -path "*deployment*" | head -1 | xargs -I {} \
            androiddeployqt \
              --input {} \
              --output $(pwd)/android-build \
              --android-platform ${{ env.ANDROID_PLATFORM }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Inject AndroidX and build APK
        run: |
          cd build/Android_Qt_5_15_2_Clang_Multi_Abi-Release/android-build
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleRelease --no-daemon -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000 && break
            echo "Gradle failed, retry $i/3..."
            sleep $((i * 30))
          done

      - name: Decode keystore
        run: |
          if [ -n "$APK_KEYSTORE_BASE64" ]; then
            echo "$APK_KEYSTORE_BASE64" | base64 -d > /tmp/debug.keystore
            echo "Keystore created, verifying..."
            keytool -list -keystore /tmp/debug.keystore -storepass android
          else
            echo "No keystore provided, skipping decode"
          fi

      - name: Sign APK
        run: |
          if [ -n "$APK_KEYSTORE_BASE64" ]; then
            set -ex
            VERSION=${GITHUB_REF#refs/tags/}
            cd build/Android_Qt_5_15_2_Clang_Multi_Abi-Release/android-build
            APK=$(find . -name "*.apk" -path "*/release/*" | head -1)
            if [ -z "$APK" ]; then
              echo "ERROR: No APK found in build outputs"
              find . -name "*.apk" 2>/dev/null
              exit 1
            fi
            echo "Found APK: $APK"
            ls -la "$APK"
            cp "$APK" "../../FWDAgriGCS-${VERSION}-arm64-v8a.apk"
            echo "Running jarsigner..."
            jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
              -keystore /tmp/debug.keystore \
              -storepass android \
              -keypass android \
              "../../FWDAgriGCS-${VERSION}-arm64-v8a.apk" \
              androiddebugkey
            echo "Verifying signed APK..."
            jarsigner -verify -verbose "../../FWDAgriGCS-${VERSION}-arm64-v8a.apk"
            echo "Final signed APK:"
            ls -la "../../FWDAgriGCS-${VERSION}-arm64-v8a.apk"
          else
            echo "No keystore provided, skipping sign"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/*.apk
          if-no-files-found: warn

  release:
    needs: [linux-build, android-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            ## Auto-Update
            Users running older versions will be notified of this update automatically.

            ## Downloads
            - **Linux**: Download the `.AppImage` file
            - **Android**: Download the `.apk` file and install

            ## What's Changed
            See commit history for changes.
          files: |
            *.AppImage
            FWDAgriGCS-*.apk
          draft: false
          prerelease: false
