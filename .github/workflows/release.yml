name: Release

on:
  push:
    tags:
      - 'v*'

env:
  QT_VERSION: '5.15.2'
  QT_ARCH: 'gcc_64'
  ANDROID_NDK_VERSION: '21.3.6528147'
  ANDROID_BUILD_TOOLS: '28.0.3'
  ANDROID_PLATFORM: 'android-29'

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: ${{ env.QT_ARCH }}
          modules: 'charts'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-gl1.0-0 \
            libssl-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libglib2.0-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-glx0-dev \
            libxcb-keysyms1-dev \
            libxcb-image0-dev \
            libxcb-shm0-dev \
            libxcb-icccm4-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-xinerama0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            libdrm-dev \
            libgbm-dev \
            libsdl2-dev

      - name: Create build directory
        run: |
          mkdir -p build/Desktop_Qt_5_15_2_GCC_64bit-Release
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release
          qmake ../../qgroundcontrol.pro -r CONFIG+=release

      - name: Build
        run: |
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release
          make -j$(nproc)

      - name: Create AppDir
        run: |
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release/staging
          mkdir -p AppDir/Qt/libs
          cp FWD_AGRI_GCS AppDir/
          cp -L /lib/x86_64-linux-gnu/libcrypto.so.1.1 AppDir/Qt/libs/ 2>/dev/null || true
          cp -L /lib/x86_64-linux-gnu/libssl.so.1.1 AppDir/Qt/libs/ 2>/dev/null || true

      - name: Download appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Create AppImage
        run: |
          cd build/Desktop_Qt_5_15_2_GCC_64bit-Release/staging
          VERSION=${GITHUB_REF#refs/tags/}
          /tmp/appimagetool AppDir "FWDAgriGCS-${VERSION}-x86_64.AppImage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/Desktop_Qt_5_15_2_GCC_64bit-Release/staging/*.AppImage

  android-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: 'android_arm64_v8a'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sdkmanager "build-tools;${{ env.ANDROID_BUILD_TOOLS }}"

      - name: Create build directory
        run: |
          mkdir -p build/Android_Qt_5_15_2_Clang_Multi_Abi-Release

      - name: Run qmake
        working-directory: build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
        run: |
          qmake ../../qgroundcontrol.pro -r CONFIG+=release ANDROID_ABIS=arm64-v8a

      - name: Build
        working-directory: build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
        run: |
          make -j$(nproc)

      - name: Install to staging
        working-directory: build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
        run: |
          make INSTALL_ROOT=$(pwd)/android-build install

      - name: Run androiddeployqt
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
          find . -name "*.json" -path "*deployment*" | head -1 | xargs -I {} \
            androiddeployqt \
              --input {} \
              --output $(pwd)/android-build \
              --apk $(pwd)/android-build/FWD_AGRI_GCS.apk \
              --android-platform ${{ env.ANDROID_PLATFORM }} \
              --release

      - name: Decode keystore
        if: env.APK_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.APK_KEYSTORE_BASE64 }}" | base64 -d > /tmp/debug.keystore

      - name: Sign APK
        if: env.APK_KEYSTORE_BASE64 != ''
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd build/Android_Qt_5_15_2_Clang_Multi_Abi-Release
          find . -name "*.apk" -path "*/release/*" | head -1 | xargs -I {} \
            java -jar $ANDROID_HOME/build-tools/${{ env.ANDROID_BUILD_TOOLS }}/lib/apksigner.jar sign \
              --ks /tmp/debug.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "FWDAgriGCS-${VERSION}-arm64-v8a.apk" \
              {}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/Android_Qt_5_15_2_Clang_Multi_Abi-Release/*.apk

  release:
    needs: [linux-build, android-build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Release ${{ github.ref_name }}

            ## Auto-Update
            Users running older versions will be notified of this update automatically.

            ## Downloads
            - **Linux**: Download the `.AppImage` file
            - **Android**: Download the `.apk` file and install

            ## What's Changed
            See commit history for changes.
          files: |
            *.AppImage
            *.apk
          draft: false
          prerelease: false
